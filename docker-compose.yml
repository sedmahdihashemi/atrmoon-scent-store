services:
  app:
    build:
      context: .
      args:
        # Browser-side backend URL. Defaults to your own /sb proxy (see Caddyfile).
        VITE_SUPABASE_URL: ${SELF_HOST_SUPABASE_URL:-https://atrmoon.top/sb}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
    environment:
      # Server-side backend URL (used by server functions at runtime).
      SUPABASE_URL: ${SELF_HOST_SUPABASE_URL:-https://atrmoon.top/sb}
      SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
      # Optional: set these in .env to enable the Bale bot and the email queue.
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      BALE_BOT_TOKEN: ${BALE_BOT_TOKEN:-}
      LOVABLE_API_KEY: ${LOVABLE_API_KEY:-}
      LOVABLE_SEND_URL: ${LOVABLE_SEND_URL:-}
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      # Full https://... URL of your Supabase project (set in .env on the server).
      SUPABASE_UPSTREAM_HOST: ${SUPABASE_UPSTREAM_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public/.well-known:/srv/.well-known:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
